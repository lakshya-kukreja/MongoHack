[project]
name = "incident-timeline-investigator"
version = "0.1.0"
description = "Grounded RAG and deterministic timeline analysis system for incident investigations"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pymongo>=4.6.0,<5.0.0",
    "python-dateutil>=2.8.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["app", "."]
testpaths = ["../tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

